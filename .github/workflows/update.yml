name: Update GEX levels

# GitHub cron runs in UTC. These times cover both EDT and EST; run.py checks the
# New York clock and skips anything outside the trading windows, weekends and holidays.
on:
  schedule:
    # Morning 8:00 AM - 12:00 PM ET (every 20 min before the open, then every 30 min)
    - cron: "0,20,40 12-14 * * 1-5"
    - cron: "0,30 15-17 * * 1-5"
    # Evening 7:00 - 9:30 PM ET, Sunday to Thursday (crosses midnight UTC)
    - cron: "0,30 23 * * 0-4"
    - cron: "0,30 0-2 * * 1-5"
  workflow_dispatch:              # "Run workflow" button: updates right away, any time

permissions:
  contents: write

concurrency:
  group: gex-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Check New York clock
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=manual" >> "$GITHUB_OUTPUT"
          else
            python3 run.py --check
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.mode != 'skip'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.mode != 'skip'
        run: pip install -r requirements.txt

      - name: Build levels
        id: build
        if: steps.gate.outputs.mode != 'skip'
        run: python run.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      # Runs even when the build failed, so the page can show the failure warning.
      # Each commit also counts as repo activity, so GitHub never disables this schedule.
      - name: Publish
        if: always() && steps.gate.outputs.mode != 'skip'
        run: |
          git config user.name "gex-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "GEX update $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          # Each push starts a Pages rebuild on its own. Fail loudly if it never lands.
          for i in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            sleep 5
          done
          echo "::error::Could not save the new data to the repo"
          exit 1
