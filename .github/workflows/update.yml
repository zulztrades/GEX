name: Update GEX levels

# GitHub often starts scheduled runs late or drops them, so there are many start attempts and any one
# is enough: a run waits for the window to open, then refreshes every 15 min until it closes.
# Times are UTC and cover both EDT and EST; run.py checks the New York clock, weekends and holidays.
on:
  schedule:
    - cron: "7,22,37,52 11-16 * * 1-5"  # morning window, 8:00 AM - 12:15 PM ET
    - cron: "7,22,37,52 22,23 * * 0-4"  # evening window, 7:00 - 9:45 PM ET, Sunday to Thursday
    - cron: "7,22,37,52 0-2 * * 1-5"    # evening window after midnight UTC
  push:                           # code or settings changes update the page right away
    paths: ["*.py", "config.toml", "requirements.txt", ".github/workflows/update.yml"]
  workflow_dispatch:              # "Run workflow" button: updates right away, any time

permissions:
  contents: write

concurrency:
  group: gex-update
  cancel-in-progress: true   # the newest run takes over, so the button never waits

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6

      - name: Check New York clock
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "mode=manual" >> "$GITHUB_OUTPUT"
          else
            python3 run.py --check
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.mode != 'skip'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.mode != 'skip'
        run: pip install -r requirements.txt

      # Saves every refresh, including failed ones, so the page can show the failure warning.
      # Each commit also counts as repo activity, so GitHub never disables this schedule.
      - name: Update until the session ends
        if: steps.gate.outputs.mode != 'skip'
        run: |
          git config user.name "gex-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u -W ignore run.py --loop ${{ github.event_name != 'schedule' && '--force' || '' }}
